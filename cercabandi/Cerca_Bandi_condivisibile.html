AA o professionista agricolo abilitato.","La qualifica CD/IAP non è indicata come requisito base CR01, ma è premiata nei criteri di selezione: aprire una partita IVA non equivale a essere competitivi.","La casa e gli arredi a uso abitativo sono espressamente esclusi. Possono essere valutati fabbricati rurali produttivi, impianti irrigui, attrezzature, oliveto e frutteto solo se coerenti con l’attività e con tutti i titoli."],"advantages":["Il fondo con ulivi e alberi da frutto è tematicamente coerente con investimenti produttivi, irrigazione efficiente e ammodernamento agricolo.","L’aiuto base arriva al 60% e può salire nelle condizioni previste dall’avviso; la dotazione complessiva è significativa.","Un pozzo già regolare e un fabbricato realmente produttivo possono rafforzare un progetto aziendale integrato, ma non sanare irregolarità pregresse."],"weaknesses":["Il profilo non documenta impresa, fascicolo SIAN, produzione standard, bilanci agricoli, autorizzazioni o progetto: oggi manca il presupposto soggettivo.","La finestra operativa è troppo breve per costruire in modo prudente da zero impresa, redditività, progetto e titoli senza un’attività agricola già reale.","La parte più urgente per il proprietario — sistemare la casa — non è finanziabile su questa misura se resta a uso abitativo."],"redFlags":["Non costituire un’azienda agricola esclusivamente per inseguire il contributo: obblighi fiscali, previdenziali, produttivi e di mantenimento possono superarne il vantaggio.","Non iniziare lavori o ordinare beni prima della domanda quando l’avviso lo vieta; le spese possono diventare integralmente non ammissibili.","Nessuna spesa sul pozzo va inserita finché concessione, uso, portata e regolarità non sono verificati con Provincia di Taranto e disciplina regionale.","Ginosa ricade in una delimitazione per Xylella multiplex ST26, ma ciò non rende automaticamente la particella ammissibile alle misure dedicate a Xylella pauca."],"nextSteps":["Chiedere a CAA, agronomo uti-finanziamenti/citta-rigenerative-strategie-integrate-rigenerazione-urbana-mobilita-sostenibile-qualita-dellaria","sourceType":"Fonte primaria","sourceDate":"Verificato l’8 agosto 2026","confidence":"Alta","targetProfileId":"studio-fauda","profileScores":{"studio-fauda":92,"digital-library":42,"nova":30,"piccolo-comune-alto-piemonte":78},"profileVerdicts":{"studio-fauda":"AZIONE COMMERCIALE · non candidabile direttamente","digital-library":"NO-GO come beneficiario","nova":"NO-GO come beneficiario","piccolo-comune-alto-piemonte":"GO SOLO SE AMMESSO · PFTE + 10% cofinanziamento"},"profileAnalyses":{"piccolo-comune-alto-piemonte":{"eligibility":["Il Comune è beneficiario diretto solo se incluso nelle zone di qualità dell’aria ammesse dall’avviso; la provincia di appartenenza non basta.","La domanda richiede PFTE approvato, disponibilità delle aree, copertura finanziaria, inserimento nella programmazione e piano quinquennale di gestione e monitoraggio.","Il contributo può arrivare al 90%: almeno il 10% e le spese non ammissibili devono risultare sostenibili nel bilancio del Comune reale."],"advantages":["Intervento coerente con spazio pubblico, mobilità, adattamento climatico e rigenerazione dei centri minori.","Le spese tecniche sono ammissibili entro il limite previsto dall’avviso, riducendo il carico netto sul bilancio se il quadro economico è corretto."],"weaknesses":["La persona non contiene ancora PFTE, area, dati ambientali, cofinanziamento né capacità di gestione: oggi non consente un GO definitivo.","Per un ufficio ridotto, progettazione, atti, affidamenti, monitoraggio e rendicontazione possono saturare la capacità amministrativa anche con un buon contributo."],"redFlags":["NO-GO immediato se il Comune non è nell’elenco territoriale ammesso.","Lo sportello può esaurire le risorse prima della scadenza nominale: un PFTE da avviare ora è con ogni probabilità troppo tardi.","Non candidare opere sovradimensionate rispetto alla manutenzione quinquennale e alla cassa disponibile."],"nextSteps":["Verificare Comune, popolazione, zona di qualità dell’aria e titolarità dell’area sulla fonte primaria.","Far validare a RUP e ragioneria PFTE, quadro economico, 10% minimo, anticipazioni di cassa e costi non ammissibili.","Procedere solo con cronoprogramma degli atti e data di invio compatibile con lo sportello."]}},"eligibility":["Possono presentare domanda le amministrazioni comunali comprese nelle zone di qualità dell’aria IT0118, IT0119 e IT0120; Studio Fauda non è beneficiario diretto.","La domanda deve includere un PFTE approvato, relazione tecnico-economica, copertura finanziaria, disponibilità delle aree e inserimento nella programmazione delle opere pubbliche.","Gli interventi devono ridisegnare lo spazio pubblico vicino a poli attrattori, dimostrare il miglioramento ambientale e microclimatico e disporre di un piano quinquennale di gestione, manutenzione e monitoraggio."],"advantages":["Forte allineamento con rigenerazione urbana, spazio pubblico, opere comunali e progettazione integrata.","Le spese tecniche per progettazione, direzione lavori, sicurezza, indagini e studi sono ammissibili fino al 25% dell’importo lavori; il contributo può arrivare al 90% dei costi ammissibili."],"weaknesses":["Studio Fauda può ottenere un incarico, non il contributo: dipende da un Comune beneficiario e dalle regole di affidamento pubblico.","PFTE e indicatori quantitativi su traffico, PM10, NOx e CO₂ devono essere pronti già in domanda: un concept preliminare non è sufficiente."],"redFlags":["La procedura è a sportello e può chiudere prima del 30 ottobre per esaurimento fondi: non usare la scadenza nominale come vero margine operativo.","Non investire in concept gratuiti per Comuni senza PFTE, area disponibile, mandato politico e almeno il 10% di cofinanziamento definito.","Separare l’assistenza alla candidatura dall’eventuale affidamento della progettazione, nel rispetto del Codice dei contratti."],"nextSteps":["Entro 72 ore costruire una shortlist di Comuni eleggibili già clienti o con PFTE e intervento programmato.","Applicare cinque gate: Comune in elenco, PFTE approvabile, area disponibile per almeno 20 anni, cofinanziamento ≥10% e dati ambientali misurabili.","Concordare subito con gli enti che superano i gate il percorso di affidamento dei servizi tecnici e la data reale di invio allo sportello."]},{"id":"piemonte-sport-energia-2026","level":"Regionale","kind":"Contributo","status":"Aperto","participationMode":"Opportunità commerciale indiretta","profileParticipationModes":{"piccolo-comune-alto-piemonte":"Candidatura diretta"},"title":"Efficienza energetica e rinnovabili negli impianti sportivi pubblici","authority":"Regione Piemonte · PR FESR 2021–2027","territory":"Piemonte","theme":"Riqualificazione edilizia ed efficienza energetica","deadline":"30 ottobre 2026 · ore 12:00","daysLeft":83,"value":"€ 14.000.000 · contributo fino al 70%","risk":"Alto","effort":"Commerciale · 4–8 gg/uomo per ente pre-qualificato","profileEfforts":{"piccolo-comune-alto-piemonte":"Alto · 15–30 gg/uomo più diagnosi EGE, progettazione e atti"},"probability":"25–45% di incarico con diagnosi EGE, consumi triennali e cofinanziamento già disponibili","profileProbabilities":{"piccolo-comune-alto-piemonte":"30–55% solo con immobile ammissibile, diagnosi EGE, consumi triennali e 30% di copertura"},"sourceName":"Bandi Regione Piemonte · edifici e impianti sportivi","sourceUrl":"https://bandi.regione.piemonte.it/contributi-finanziamenti/bando-efficienza-energetica-e-fonti-rinnovabili-negli-edifici-strutture-e","sourceType":"Fonte primaria","sourceDate":"Verificato l’8 agosto 2026","confidence":"Alta","targetProfileId":"studio-fauda","profileScores":{"studio-fauda":93,"digital-library":28,"nova":18,"piccolo-comune-alto-piemonte":91},"profileVerdicts":{"studio-fauda":"AZIONE COMMERCIALE · shortlist enti e impianti","digital-library":"NO-GO","nova":"NO-GO","piccolo-comune-alto-piemonte":"GO CONDIZIONATO · diagnosi EGE + 30% copertura"},"profileAnalyses":{"piccolo-comune-alto-piemonte":{"eligibility":["Il Comune può essere beneficiario diretto per un edificio o impianto sportivo pubblico a uso pubblico e destinato ad attività non professionali.","È obbligatoria una diagnosi energetica di EGE certificato UNI CEI 11339:2023, fondata su almeno tre anni di consumi reali e conforme alla UNI CEI EN 16247.","Il contributo copre fino al 70%: il bilancio deve sostenere almeno il 30%, le spese non ammissibili e le anticipazioni di cassa."],"advantages":["Riduzione strutturale dei costi energetici di un bene comunale, con beneficio misurabile anche dopo la fine del progetto.","La combinazione di efficienza e rinnovabili è coerente con impianti sportivi energivori e patrimoni pubblici datati."],"weaknesses":["La persona non dimostra proprietà, uso, consumi, diagnosi, progetto, copertura finanziaria né capacità di affidamento.","Il 30% a carico dell’ente può essere insostenibile per un piccolo Comune anche quando l’investimento è tecnicamente conveniente."],"redFlags":["NO-GO se mancano tre anni completi di consumi o una diagnosi EGE conforme già disponibile in tempi utili.","Verificare cumulo con altri incentivi e doppio finanziamento prima di approvare il piano economico.","Non usare risparmi energetici teorici per giustificare una cassa che il Comune non possiede."],"nextSteps":["Selezionare un solo impianto con proprietà e destinazione d’uso incontestabili e recuperare bollette/consumi del triennio.","Far stimare a EGE e progettista risparmi, costi, tempi, manutenzione e copertura comunale.","Portare a RUP e ragioneria una decisione GO/NO-GO con cronoprogramma di affidamenti e rendicontazione."]}},"eligibility":["Beneficiari sono Comuni, Province, Città Metropolitana, Unioni di Comuni e Unioni montane del Piemonte; Studio Fauda opera solo come fornitore di servizi tecnici.","Gli immobili devono essere pubblici, a uso pubblico e destinati ad attività sportive non professionali; il contributo può coprire fino al 70% delle spese ammissibili.","È obbligatoria una diagnosi energetica redatta da EGE certificato UNI CEI 11339:2023, basata sui consumi reali di almeno un triennio e conforme alla UNI CEI EN 16247."],"advantages":["Aderenza molto alta alle competenze su edifici pubblici, energia, impianti, sicurezza e progettazione.","Il bando finanzia operazioni realizzate tramite appalti pubblici e riconosce esplicitamente la diagnosi energetica tra le spese tecniche ammissibili."],"weaknesses":["Le domande sono istruite in ordine di presentazione e lo sportello può chiudere prima del 30 ottobre: un progetto immaturo ha scarso valore commerciale.","Il 30% non coperto e le spese non ammissibili possono bloccare enti interessati ma senza capacità finanziaria."],"redFlags":["NO-GO commerciale per enti senza disponibilità dell’immobile, consumi completi di tre anni, EGE incaricato e copertura del cofinanziamento.","Verificare cumulo con Conto Termico e rischio di doppio finanziamento prima di formulare il piano economico."],"nextSteps":["Selezionare impianti con consumi elevati, proprietà chiara e diagnosi EGE già disponibile o completabile rapidamente.","Preparare una checklist unica per consumi triennali, requisiti tecnici, cofinanziamento, cronoprogramma e affidamento dei servizi.","Limitare l’attività gratuita alla pre-qualifica; formalizzare l’incarico prima della progettazione di dettaglio."]},{"id":"piemonte-accordi-programma-2026-2028","level":"Regionale","kind":"Contributo","status":"Aperto","participationMode":"Opportunità commerciale indiretta","profileParticipationModes":{"piccolo-comune-alto-piemonte":"Candidatura diretta"},"title":"Accordi di Programma 2026–2028 per opere pubbliche di sviluppo locale","authority":"Regione Piemonte · Fondo Sviluppo e Coesione","territory":"Piemonte","theme":"Sviluppo territoriale","deadline":"21 settembre 2026 · ore 12:00","daysLeft":44,"value":"€ 5.971.887,56 di dotazione","risk":"Medio","effort":"Commerciale · 4–7 gg/uomo per proposta","profileEfforts":{"piccolo-comune-alto-piemonte":"Alto · 12–24 gg/uomo se il progetto è già approvato; molto superiore se immaturo"},"probability":"15–30% di incarico con Comune/Unione, livello progettuale approvato e opera già programmata","profileProbabilities":{"piccolo-comune-alto-piemonte":"15–30% con una sola opera matura, programmata, sostenibile e documentabile"},"sourceName":"Bandi Regione Piemonte · Accordi di Programma 2026–2028","sourceUrl":"https://bandi.regione.piemonte.it/contributi-finanziamenti/avviso-gli-anni-2026-2028-finanziamento-accordi-programma","sourceType":"Fonte primaria","sourceDate":"Verificato l’8 agosto 2026","confidence":"Alta","targetProfileId":"studio-fauda","profileScores":{"studio-fauda":88,"digital-library":46,"nova":30,"piccolo-comune-alto-piemonte":84},"profileVerdicts":{"studio-fauda":"AZIONE COMMERCIALE · solo opere già mature","digital-library":"APPROFONDIRE solo su patrimonio culturale","nova":"NO-GO come beneficiario","piccolo-comune-alto-piemonte":"GO CONDIZIONATO · una sola opera già matura"},"profileAnalyses":{"piccolo-comune-alto-piemonte":{"eligibility":["Comuni e Unioni di Comuni del Piemonte possono presentare una proposta; la persona rientra nella categoria astratta, ma va sostituita con l’ente reale.","L’opera deve essere coerente con gli obiettivi dell’avviso e sostenibile sul piano tecnico, fisico e finanziario.","Il livello progettuale già approvato e la cantierabilità incidono sul punteggio: una semplice idea non è competitiva."],"advantages":["Perimetro ampio, adatto a opere prioritarie su viabilità, edifici pubblici, sicurezza, rigenerazione e sviluppo locale.","Può trasformare un intervento già nel DUP o nel programma triennale in una proposta finanziabile senza inventare un nuovo progetto."],"weaknesses":["Dotazione contenuta rispetto alla platea potenziale e una sola proposta per ente: scegliere male l’opera brucia l’opportunità.","La persona non dimostra progetto approvato, copertura, autorizzazioni, RUP o capacità esecutiva."],"redFlags":["NO-GO per opere nate dopo l’avviso e prive di localizzazione, quadro economico, proprietà o livello progettuale.","Non scegliere l’opera più visibile politicamente se un altro intervento è più cantierabile e sostenibile.","Verificare che manutenzione e spese future non creino un costo strutturale incompatibile col bilancio."],"nextSteps":["Confrontare tutte le opere nel DUP e nel programma triennale con criteri, premialità e documenti richiesti.","Far scegliere formalmente una sola proposta a organo politico, RUP e responsabile finanziario sulla base di evidenze comparabili.","Procedere solo se progetto, copertura, autorizzazioni e cronoprogramma sono già dimostrabili entro la scadenza."]}},"eligibility":["Possono presentare proposte Comuni e Unioni di Comuni del Piemonte; Studio Fauda non presenta direttamente.","Ciascun ente può presentare una sola proposta; le opere devono essere coerenti con gli obiettivi FSC e sostenibili sotto il profilo tecnico, fisico e finanziario.","La documentazione del livello di progettazione già approvato attribuisce punteggio di cantierabilità; urgenze, messa a norma, efficientamento, recupero e ristrutturazione possono generare ulteriori premialità."],"advantages":["Perimetro ampio, compatibile con edilizia pubblica, viabilità, rigenerazione, sicurezza territoriale e sviluppo locale.","Può valorizzare il rapporto dello studio con enti piccoli e medi quando esiste già un progetto approvato da trasformare in proposta competitiva."],"weaknesses":["Dotazione complessiva contenuta rispetto al numero potenziale di proposte: selettività probabile.","La finestra di 44 giorni è insufficiente per trasformare un’idea priva di localizzazione, quadro economico, livello progettuale e decisione amministrativa in proposta competitiva."],"redFlags":["Non inseguire proposte nate solo dopo la pubblicazione dell’avviso: la cantierabilità documentata pesa in valutazione.","Evitare incarichi a successo non compatibili con le regole professionali e con l’equilibrio economico dello studio."],"nextSteps":["Interrogare il portafoglio clienti per opere già nel DUP o nel programma triennale.","Valutare ogni proposta con quattro gate: unicità della candidatura dell’ente, maturità amministrativa, copertura finanziaria e livello progettuale approvato.","Produrre la relazione tecnica, fisica e finanziaria solo per gli enti che superano i gate e possono documentare le premialità dichiarate."]},{"id":"mit-elenco-e00023","level":"Regionale","kind":"Qualificazione","status":"Aperto","participationMode":"Qualificazione operativa","profileParticipationModes":{"piccolo-comune-alto-piemonte":"Non applicabile"},"title":"Elenco per servizi di ingegneria, architettura e altri servizi tecnici","authority":"Provveditorato Interregionale OO.PP. Piemonte, Valle d’Aosta e Liguria","territory":"Piemonte · Valle d’Aosta · Liguria","theme":"Sviluppo territoriale","deadline":"Iscrizione aperta · nessuna chiusura pubblicata","daysLeft":null,"value":"Nessun affidamento immediato · abilita a future selezioni","risk":"Basso","effort":"Basso · 2–4 gg/uomo","probability":"Non è una gara: aumenta l’accessibilità agli inviti, senza garantire incarichi","sourceName":"Portale Appalti MIT · elenco E00023","sourceUrl":"https://portaleappalti.mit.gov.it/PortaleAppalti/it/ppgare_oper_ec_bandi_avvisi.wp?actionPath=%2FExtStr2%2Fdo%2FFrontEnd%2FBandi%2FviewIscrizione.action&codice=E00023&currentFrame=7","sourceType":"Fonte primaria","sourceDate":"Verificato l’8 agosto 2026","confidence":"Alta","targetProfileId":"studio-fauda","profileScores":{"studio-fauda":87,"digital-library":20,"nova":10,"piccolo-comune-alto-piemonte":6},"profileVerdicts":{"studio-fauda":"ISCRIVERSI · priorità operativa","digital-library":"NON APPLICABILE","nova":"NON APPLICABILE","piccolo-comune-alto-piemonte":"NON APPLICABILE · elenco per operatori economici"},"eligibility":["L’avviso E00023 è aperto dal 10 giugno 2026 per operatori di servizi di ingegneria, architettura e altri servizi tecnici.","L’iscrizione richiede registrazione al portale, selezione delle categorie e caricamento delle dichiarazioni e dei documenti previsti dall’avviso."],"advantages":["Costo di accesso contenuto e coerenza territoriale molto alta.","Riduce il rischio di non essere intercettati per futuri affidamenti e indagini di mercato del Provveditorato."],"weaknesses":["L’iscrizione non equivale a una gara né produce fatturato immediato.","Categorie o documenti caricati in modo generico possono rendere lo studio invisibile o non qualificato per gli inviti pertinenti."],"redFlags":["Verificare se Studio Fauda è già iscritto prima di creare una duplicazione.","Pianificare rinnovi e aggiornamenti: un elenco non mantenuto diventa una falsa copertura commerciale."],"nextSteps":["Controllare registrazione, stato dell’iscrizione e categorie già attive sul portale.","Allineare categorie, referenze, professionisti e documenti alla matrice commerciale dello studio.","Assegnare un responsabile e una verifica trimestrale dell’elenco."]},{"id":"mepa-servizi-ingegneria-civile","level":"Nazionale","kind":"Qualificazione","status":"Aperto","participationMode":"Qualificazione operativa","profileParticipationModes":{"piccolo-comune-alto-piemonte":"Non applicabile"},"title":"MePA: servizi professionali di progettazione e verifica di opere di ingegneria civile","authority":"Consip · Acquisti in Rete PA","territory":"Italia","theme":"Sviluppo territoriale","deadline":"Abilitazione aperta · verificare la categoria attiva","daysLeft":null,"value":"Nessun affidamento immediato · accesso a RdO e negoziazioni","risk":"Basso","effort":"Basso · 2–5 gg/uomo","probability":"Non è una gara: abilita alla domanda pubblica, ma serve presidio commerciale","sourceName":"Acquisti in Rete PA · categoria ingegneria civile","sourceUrl":"https://www.acquistinretepa.it/opencms/opencms/programma_approfondimenti_ingegneria_civile.html","sourceType":"Fonte primaria","sourceDate":"Verificato l’8 agosto 2026","confidence":"Alta","targetProfileId":"studio-fauda","profileScores":{"studio-fauda":82,"digital-library":24,"nova":12,"piccolo-comune-alto-piemonte":6},"profileVerdicts":{"studio-fauda":"VERIFICARE / AGGIORNARE ABILITAZIONE","digital-library":"NON APPLICABILE","nova":"NON APPLICABILE","piccolo-comune-alto-piemonte":"NON APPLICABILE · il Comune acquista, non si abilita come fornitore"},"eligibility":["L’operatore deve essere registrato su Acquisti in Rete e abilitato alla categoria coerente con i servizi professionali effettivamente offerti.","Dichiarazioni, requisiti e catalogazione devono essere aggiornati secondo la documentazione vigente del bando MePA Servizi."],"advantages":["Canale nazionale ricorrente per affidamenti e richieste di offerta della PA.","L’abilitazione valorizza il profilo tecnico dello studio anche fuori dal perimetro provinciale abituale."],"weaknesses":["Elevata concorrenza e molte negoziazioni basate sul prezzo.","Senza alert, parole chiave e presidio delle richieste, l’abilitazione resta passiva e genera poco valore."],"redFlags":["Non confondere l’abilitazione con un flusso automatico di incarichi.","Definire soglie minime di margine e territori servibili prima di rispondere alle RdO."],"nextSteps":["Verificare lo stato attuale dell’abilitazione e la corrispondenza delle categorie.","Aggiornare anagrafica, professionisti, servizi, documenti e aree territoriali.","Creare una routine settimanale per selezionare RdO coerenti ed escludere quelle a margine insufficiente."]},{"id":"csp-spazi-partecipazione-2026","level":"Regionale","kind":"Avviso","status":"Aperto","participationMode":"Candidatura diretta","profileParticipationModes":{"nova":"Candidatura diretta","studio-fauda":"Non applicabile","digital-library":"Non applicabile","piccolo-comune-alto-piemonte":"Non applicabile"},"title":"Nuovi spazi di partecipazione attiva: pre-assessment e successivo sostegno","authority":"Fondazione Compagnia di San Paolo · capitale filantropico privato","territory":"Piemonte · Liguria · Valle d’Aosta","theme":"Partecipazione civica e cittadinanza europea","deadline":"22 settembre 2026","daysLeft":44,"value":"Prima fase di assessment; eventuale richiesta di contributo solo dopo esito positivo","risk":"Alto","effort":"Medio-alto · pre-assessment, video, titolarità dello spazio e assetto gestionale","profileEfforts":{"nova":"Medio-alto · sostenibile solo se esiste già uno spazio preciso e documentato"},"probability":"0% senza disponibilità di uno spazio; non stimabile prima del pre-assessment","profileProbabilities":{"nova":"0% nello stato documentale attuale; da stimare solo con spazio, territorio e modello gestionale verificati"},"sourceName":"Fondazione Compagnia di San Paolo · Linee Guida per nuovi spazi di partecipazione attiva","sourceUrl":"https://www.compagniadisanpaolo.it/it/contributi/linee-guida-per-nuovi-spazi-di-partecipazione-attiva/","sourceType":"Fonte primaria","sourceDate":"Verificato il 9 agosto 2026","confidence":"Alta","targetProfileId":"nova","profileScores":{"studio-fauda":18,"digital-library":24,"nova":84,"piccolo-comune-alto-piemonte":20,"proprietario-rurale-ginosa":8},"profileVerdicts":{"studio-fauda":"NON APPLICABILE","digital-library":"NON APPLICABILE","nova":"NO-GO OGGI · manca uno spazio con titolo di gestione","piccolo-comune-alto-piemonte":"NON AMMESSO · enti pubblici esclusi","proprietario-rurale-ginosa":"NO-GO"},"eligibility":["Il proponente deve essere un ente non a scopo di lucro, anche in partenariato, ammissibile ai contributi della Fondazione.","Deve già avere la titolarità o co-titolarità di gestione di uno spazio preciso in Piemonte, Liguria o Valle d’Aosta; gli enti pubblici sono esclusi.","La candidatura iniziale non è una domanda di contributo: consente l’accesso a un assessment, dopo il quale potrà aprirsi una successiva richiesta di sostegno."],"advantages":["La finalità su cittadinanza attiva, comunità e partecipazione è molto coerente con NOVA.","Il percorso valuta anche governance, sostenibilità, stakeholder e attivazione della comunità: può rafforzare un progetto organizzativo ancora giovane."],"weaknesses":["Il profilo NOVA non documenta alcuno spazio, titolo di gestione o progetto territoriale nel Nord-Ovest.","Newsletter e community digitale non sostituiscono il requisito fisico e gestionale dello spazio.","L’eventuale contributo è successivo e non garantito: la prima fase assorbe lavoro senza certezza di finanziamento."],"redFlags":["NO-GO immediato se lo spazio è solo un’idea o se manca un titolo di gestione già dimostrabile.","Non presentare l’assessment come finanziamento già disponibile.","Non forzare NOVA verso uno spazio fisico se questo non è coerente con la sua strategia reale."],"nextSteps":["Verificare se NOVA gestisce o co-gestisce davvero uno spazio nel territorio ammesso.","Solo in caso positivo, controllare statuto, modello economico non profit, governance e documenti richiesti per il pre-assessment.","In assenza dello spazio, archiviare l’avviso senza investire ulteriori ore e mantenere attivo il monitoraggio filantropico."]},{"id":"fondazione-crt-ordinarie-2026","level":"Regionale","kind":"Contributo","status":"Aperto","participationMode":"Candidatura diretta","profileParticipationModes":{"nova":"Candidatura diretta","studio-fauda":"Non applicabile","proprietario-rurale-ginosa":"Non applicabile"},"title":"Ordinarie 2026: progetti di welfare, istruzione, cultura e sviluppo locale","authority":"Fondazione CRT · capitale filantropico privato","territory":"Progetti da realizzare in Piemonte o Valle d’Aosta","theme":"Politiche pubbliche e innovazione sociale","deadline":"15 ottobre 2026 · ore 15:00","daysLeft":67,"value":"Contributo determinato dalla Fondazione · cofinanziamento obbligatorio, senza soglia minima fissa","risk":"Alto","effort":"Alto · progetto, quadro economico, preventivi, documenti ente e cofinanziamento","profileEfforts":{"nova":"Alto · 12–20 gg/uomo dopo il superamento dei gate giuridici e territoriali"},"probability":"0% se l’ente è nato dopo il 31 dicembre 2024 o assimilabile a soggetto politico","profileProbabilities":{"nova":"0% finché data di costituzione, indipendenza politica, statuto e progetto territoriale non sono verificati"},"sourceName":"Fondazione CRT · Bando Ordinarie 2026 e Regolamento generale","sourceUrl":"https://www.fondazionecrt.it/wp-content/uploads/2026/01/bando-ordinarie-2026-def.pdf","sourceType":"Fonte primaria","sourceDate":"Allegati verificati il 9 agosto 2026","confidence":"Alta","targetProfileId":"nova","profileScores":{"studio-fauda":20,"digital-library":36,"nova":82,"piccolo-comune-alto-piemonte":58,"proprietario-rurale-ginosa":12},"profileVerdicts":{"studio-fauda":"NON APPLICABILE COME IMPRESA","digital-library":"APPROFONDIRE SOLO SU PROGETTO TERRITORIALE","nova":"NO-GO FINCHÉ NON SUPERATI I GATE GIURIDICI","piccolo-comune-alto-piemonte":"APPROFONDIRE · una proposta locale coerente","proprietario-rurale-ginosa":"NO-GO"},"eligibility":["Il progetto deve realizzarsi in Piemonte o Valle d’Aosta, anche se il proponente ha sede altrove, e avere rilevanza almeno locale.","Sono esclusi i soggetti privati costituiti dopo il 31 dicembre 2024, gli enti con fini di lucro, i partiti e movimenti politici e le loro articolazioni.","Lo statuto deve rendere esplicite assenza di lucro e non distribuzione degli avanzi; una richiesta priva di cofinanziamento è inammissibile.","Servono relazione sull’attività 2025–2026, progetto, quadro economico dettagliato e preventivi di terzi."],"advantages":["Le aree istruzione, sviluppo locale, cultura e volontariato possono ospitare un progetto civico ben circoscritto.","La seconda finestra lascia tempo per costruire un progetto locale con partner e budget verificabili."],"weaknesses":["NOVA appare un’iniziativa recente: se l’associazione è stata formalmente costituita dopo il 31 dicembre 2024, la candidatura è esclusa.","Sede nazionale o community online non bastano: serve un progetto concreto nel territorio ammesso.","Bilanci, attività 2025, cofinanziamento, preventivi e capacità di rendicontazione non sono documentati nel profilo."],"redFlags":["Verificare con particolare severità l’indipendenza formale da partiti e movimenti politici e l’assenza di condizionamenti statutari incompatibili.","Non spendere tempo sulla proposta finché data di costituzione e statuto non superano il controllo di ammissibilità.","Non confondere affinità con i temi civici e ammissibilità della forma organizzativa."],"nextSteps":["Controllare atto costitutivo, statuto, data di registrazione e autonomia da soggetti politici.","Definire un progetto specifico in Piemonte o Valle d’Aosta, con destinatari, partner, risultati e cofinanziamento reale.","Solo dopo esito positivo dei gate, preparare quadro economico, preventivi e relazione sulle attività pregresse."]}],"sources":[{"id":"eu-funding-tenders","scope":"Base comune","packIds":[],"level":"UE","name":"Funding & Tenders Portal","covers":"Grant, call, premi e procurement gestiti dalle istituzioni UE","method":"Ricerca strutturata + lettura topic e allegati","status":"Fonte comune","type":"Istituzionale","capital":"Pubblico UE","url":"https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/home"},{"id":"ted","scope":"Base comune","packIds":[],"level":"UE","name":"TED","covers":"Appalti pubblici europei","method":"Search API ufficiale + avviso","status":"API disponibile","type":"Istituzionale","capital":"Procurement","url":"https://ted.europa.eu/"},{"id":"incentivi","scope":"Base comune","packIds":[],"level":"Italia","name":"Incentivi.gov.it","covers":"Catalogo degli incentivi delle amministrazioni italiane","method":"Catalogo + rinvio all’ente titolare","status":"Fonte comune","type":"Istituzionale","capital":"Pubblico nazionale","gate":"Il catalogo orienta; requisiti e scadenze si confermano sulla fonte dell’amministrazione titolare.","url":"https://www.incentivi.gov.it/it/catalogo"},{"i let state={view:'opportunities',profile:DATA.profiles[0]?.id||'',level:'',status:'',query:''};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function header(kicker,title){return '<div class="top"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1></div></div>'}
function opportunities(){const p=DATA.profiles.find(x=>x.id===state.profile)||DATA.profiles[0];let rows=DATA.opportunities.filter(o=>(!state.level||o.level===state.level)&&(!state.status||o.status===state.status)&&(!state.query||(o.title+' '+o.authority+' '+o.theme+' '+o.territory).toLowerCase().includes(state.query.toLowerCase())));return header('Ricerca e valutazione','Opportunità')+'<div class="controls"><label>Analizza come<select id="profile">'+DATA.profiles.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===p.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label><label>Livello<select id="level"><option value="">Tutti</option>'+['Europeo','Nazionale','Regionale','Locale'].map(x=>'<option '+(x===state.level?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Stato<select id="status"><option value="">Tutti</option>'+['Aperto','In arrivo','Chiuso'].map(x=>'<option '+(x===state.status?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Parole chiave<input id="query" value="'+esc(state.query)+'" placeholder="es. rigenerazione"></label></div><div class="cards">'+(rows.map(o=>{const score=o.profileScores?.[p.id]??0,verdict=o.profileVerdicts?.[p.id]||'';return '<article class="card"><div class="meta"><span class="pill">'+esc(o.level)+'</span><span class="pill">'+esc(o.status)+'</span><span class="pill">'+esc(o.kind)+'</span></div><h2>'+esc(o.title)+'</h2><p class="muted">'+esc(o.authority)+' · '+esc(o.territory)+'</p><div class="score">'+score+'%</div><p><b>'+esc(verdict)+'</b></p><p>'+esc(o.value)+'<br><b>Scadenza:</b> '+esc(o.deadline)+'</p><a href="'+esc(o.sourceUrl)+'" target="_blank" rel="noopener">Apri la fonte ufficiale ↗</a></article>'}).join('')||'<div class="empty">Nessun risultato con questi criteri.</div>')+'</div>'}
function profiles(){return header('Soggetti e persone','Profili')+'<div class="cards">'+DATA.profiles.map(p=>'<article class="card profile" style="--accent:var(--'+esc(p.accent||'lime')+')"><div class="eyebrow">'+esc(p.organizationType)+'</div><h2>'+esc(p.name)+'</h2><p>'+esc(p.headquarters)+'</p><p><b>Forma:</b> '+esc(p.legalForm)+'</p><p><b>Temi</b></p><ul>'+p.themes.slice(0,6).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p class="muted">Verifica: '+esc(p.verifiedAt)+'</p></article>').join('')+'</div>'}
function sources(){return header('Copertura dichiarata','Fonti')+'<table class="sources"><thead><tr><th>Fonte</th><th>Livello</th><th>Copertura</th><th>Metodo</th></tr></thead><tbody>'+DATA.sources.map(s=>'<tr><td><a href="'+esc(s.url)+'" target="_blank">'+esc(s.name)+'</a></td><td>'+esc(s.level)+'</td><td>'+esc(s.covers)+'</td><td>'+esc(s.method)+'</td></tr>').join('')+'</tbody></table>'}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));document.getElementById('app').innerHTML=state.view==='profiles'?profiles():state.view==='sources'?sources():opportunities();['profile','level','status','query'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener(id==='query'?'input':'change',e=>{state[id]=e.target.value;render()})})}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;render()}));render();</script></body></html>
